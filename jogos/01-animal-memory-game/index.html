<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jogo da Memória — Animals</title>
<style>
  :root { --ink:#26324b; --purple:#7657d5; --pink:#ff8eaa; --yellow:#ffd66b; --blue:#9edcf2; --green:#8bd8b0; }
  * { box-sizing:border-box; }
  body {
    margin:0; min-height:100vh; font-family: "Trebuchet MS", Arial, sans-serif; color:var(--ink);
    background: radial-gradient(circle at 10% 10%, #fff4c9 0 9%, transparent 10%),
                radial-gradient(circle at 90% 15%, #dff5ff 0 10%, transparent 11%),
                linear-gradient(135deg,#fff8ec,#f1edff);
  }
  .wrap { max-width:1050px; margin:auto; padding:24px 18px 40px; }
  header { text-align:center; margin-bottom:20px; }
  .kicker { display:inline-block; background:#fff; border:2px solid #eee5ff; border-radius:999px; padding:7px 14px; font-weight:800; color:var(--purple); font-size:.85rem; }
  h1 { font-size:clamp(2rem,5vw,3.2rem); margin:12px 0 5px; color:#48358c; }
  .subtitle { margin:0; font-size:1.05rem; color:#66708a; }
  .panel { background:rgba(255,255,255,.88); border:2px solid #eee8ff; border-radius:24px; padding:18px; box-shadow:0 10px 28px #57439a12; }
  .topline { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:14px; }
  .round { font-weight:900; font-size:1.25rem; color:#4b3b91; }
  .progress { display:flex; gap:7px; align-items:center; }
  .dot { width:13px; height:13px; border-radius:50%; background:#e3def4; }
  .dot.active { background:var(--purple); box-shadow:0 0 0 4px #7657d522; }
  .dot.done { background:var(--green); }
  .instructions { text-align:center; background:#fff6d9; border:2px dashed #f1cb58; border-radius:16px; padding:12px; margin:10px 0 18px; line-height:1.5; }
  .instructions strong { color:#805b00; }
  .grid { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:12px; }
  .card { border:0; padding:0; background:transparent; cursor:pointer; min-width:0; color:inherit; perspective:900px; }
  .card:focus-visible { outline:4px solid #6c54c8; outline-offset:4px; border-radius:18px; }
  .inner { min-height:150px; height:100%; position:relative; transform-style:preserve-3d; transition:transform .45s; }
  .card.open .inner, .card.matched .inner { transform:rotateY(180deg); }
  .face { position:absolute; inset:0; border-radius:19px; backface-visibility:hidden; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:12px 7px; text-align:center; border:3px solid white; box-shadow:0 5px 12px #40366b18; }
  .back { background:linear-gradient(145deg,#9279e8,#6b56c6); color:white; }
  .back .number { font-size:2rem; font-weight:1000; background:#ffffff28; border:2px solid #ffffff80; width:53px; height:53px; border-radius:17px; display:grid; place-items:center; }
  .back small { margin-top:9px; font-weight:800; letter-spacing:.05em; }
  .front { transform:rotateY(180deg); background:#fff; }
  .card:nth-child(5n+1) .front { background:#fff0f3; }
  .card:nth-child(5n+2) .front { background:#effaff; }
  .card:nth-child(5n+3) .front { background:#fff8df; }
  .card:nth-child(5n+4) .front { background:#effaf2; }
  .card:nth-child(5n) .front { background:#f4f0ff; }
  .animal { font-size:2.8rem; line-height:1.1; }
  .word { font-size:1.18rem; font-weight:1000; margin-top:8px; letter-spacing:.04em; overflow-wrap:anywhere; }
  .hint { color:#66708a; font-size:.88rem; margin-top:4px; }
  .card.matched { cursor:default; }
  .card.matched .front { border-color:#69c99b; box-shadow:0 0 0 3px #69c99b45,0 5px 12px #40366b18; }
  .card.matched .front:after { content:"✓"; position:absolute; top:7px; right:10px; color:#269766; font-size:1.2rem; font-weight:1000; }
  .actions { display:flex; justify-content:center; gap:10px; flex-wrap:wrap; margin-top:20px; }
  .btn { border:0; border-radius:999px; padding:12px 21px; font-weight:900; font-size:1rem; cursor:pointer; transition:transform .15s,filter .15s; }
  .btn:hover { transform:translateY(-2px); filter:brightness(1.03); }
  .btn:disabled { opacity:.45; cursor:not-allowed; transform:none; }
  .secondary { background:#eeeaff; color:#5944a4; }
  .primary { background:var(--purple); color:white; box-shadow:0 5px 0 #5942ae; }
  .status { text-align:center; min-height:28px; margin:14px 0 0; font-weight:800; color:#5d5680; }
  .donebox { display:none; margin-top:18px; text-align:center; padding:18px; border-radius:18px; background:#eafaf1; border:2px solid #a8e5c4; }
  .donebox.show { display:block; }
  .donebox h2 { margin:0 0 6px; color:#247b53; }
  .donebox p { margin:0 0 13px; }
  .teacher { margin-top:18px; text-align:center; color:#7a8093; font-size:.86rem; }
  @media(max-width:700px) { .grid{grid-template-columns:repeat(2,minmax(0,1fr));} .inner{min-height:135px;} }
  @media(min-width:701px) and (max-width:900px) { .grid{grid-template-columns:repeat(5,minmax(0,1fr)); gap:8px;} .inner{min-height:135px;} .word{font-size:1rem;} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="kicker">LET'S PLAY THE GAME</div>
    <h1>ANIMALS MEMORY GAME</h1>
    <p class="subtitle"></p>
  </header>

  <main class="panel">
    <div class="topline">
      <div class="round" id="roundTitle">🌟 ROUND 1 OF 3</div>
      <div class="progress" aria-label="Progresso das rodadas">
        <span class="dot active" id="dot1"></span><span class="dot" id="dot2"></span><span class="dot" id="dot3"></span>
      </div>
    </div>
    <div class="grid" id="board" aria-label="Cartas numeradas"></div>
    <p class="status" id="status" aria-live="polite">Choose a card!</p>
    <div class="donebox" id="roundDone">
      <h2 id="doneTitle">🎉 GREAT JOB!</h2>
      <p id="doneText">You found all the pairs!</p>
      <button class="btn primary" id="nextBtn" onclick="nextRound()">NEXT ROUND ➜</button>
    </div>
    <div class="actions">
      <button class="btn secondary" onclick="resetRound()">SHUFFLE</button>
    </div>
  </main>
  <p class="teacher"></p>
</div>

<script>
const rounds = [
  [
    {en:"RABBIT", hint:"(coelhinho)", emoji:"🐰", pt:"COELHO"},
    {en:"RAT", hint:"(ratinho)", emoji:"🐭", pt:"RATO"},
    {en:"ELEPHANT", hint:"(elefante)", emoji:"🐘", pt:"ELEFANTE"},
    {en:"BIRD", hint:"(passarinho)", emoji:"🐦", pt:"PÁSSARO"},
    {en:"DOG", hint:"(cachorrinho)", emoji:"🐶", pt:"CACHORRO"}
  ],
  [
    {en:"PIG", hint:"(porquinho)", emoji:"🐷", pt:"PORCO"},
    {en:"BAT", hint:"(morceguinho)", emoji:"🦇", pt:"MORCEGO"},
    {en:"BEE", hint:"(abelhinha)", emoji:"🐝", pt:"ABELHA"},
    {en:"HORSE", hint:"(cavalinho)", emoji:"🐴", pt:"CAVALO"},
    {en:"CAT", hint:"(gatinho)", emoji:"🐱", pt:"GATO"}
  ],
  [
    {en:"BEAR", hint:"(ursinho)", emoji:"🐻", pt:"URSO"},
    {en:"LION", hint:"(leãozinho)", emoji:"🦁", pt:"LEÃO"},
    {en:"DUCK", hint:"(patinho)", emoji:"🦆", pt:"PATO"},
    {en:"TIGER", hint:"(tigrinho)", emoji:"🐯", pt:"TIGRE"},
    {en:"FISH", hint:"(peixinho)", emoji:"🐟", pt:"PEIXE"}
  ]
];
let roundIndex = 0, first = null, second = null, lock = false, matchedPairs = 0, mismatchTimer = null;
const board = document.getElementById('board');
const statusEl = document.getElementById('status');

function makeCards() {
  const animals = rounds[roundIndex];
  const cards = [];
  animals.forEach((a,i) => {
    cards.push({pair:i, type:'word', en:a.en, hint:a.hint});
    cards.push({pair:i, type:'animal', emoji:a.emoji, pt:a.pt});
  });
  // Embaralha a posição, mantendo a numeração visível no verso.
  for (let i=cards.length-1;i>0;i--) {
    const j=Math.floor(Math.random()*(i+1)); [cards[i],cards[j]]=[cards[j],cards[i]];
  }
  return cards;
}
let currentCards = [];

function render() {
  board.innerHTML = '';
  currentCards.forEach((card,index) => {
    const button = document.createElement('button');
    button.className = 'card';
    button.type = 'button';
    button.setAttribute('aria-label', `Ficha número ${index+1}`);
    button.innerHTML = `
      <div class="inner">
        <div class="face back"><div class="number">${index+1}</div><small>PICK ME!</small></div>
        <div class="face front">
          ${card.type==='word'
            ? `<div class="word">${card.en}</div>`
            : `<div class="animal">${card.emoji}</div>`}
        </div>
      </div>`;
    button.addEventListener('click',()=>flip(index,button));
    board.appendChild(button);
  });
  document.getElementById('roundTitle').textContent = `🌟 ROUND ${roundIndex+1} OF 3`;
  for(let i=1;i<=3;i++){
    const dot=document.getElementById('dot'+i);
    dot.className='dot'+(i-1<roundIndex?' done':i-1===roundIndex?' active':'');
  }
  document.getElementById('roundDone').classList.remove('show');
  statusEl.textContent='Choose a card!';
}
function startRound() { currentCards=makeCards(); first=null; second=null; lock=false; matchedPairs=0; render(); }
function flip(index,button) {
  if(lock || button.classList.contains('open') || button.classList.contains('matched')) return;
  button.classList.add('open');
  if(first===null){ first={index,button}; statusEl.textContent='Choose another card!'; return; }
  second={index,button};
  if(currentCards[first.index].pair===currentCards[second.index].pair){
    first.button.classList.add('matched'); second.button.classList.add('matched');
    first.button.disabled=true; second.button.disabled=true;
    matchedPairs++; first=null; second=null;
    if(matchedPairs===5){
      statusEl.textContent='Great job! You found all the pairs! ⭐';
      showRoundDone();
    } else statusEl.textContent='Great job! You found a pair! Choose two more cards.';
  } else {
    lock=true; statusEl.textContent='Try again!';
    const a=first.button,b=second.button;
    mismatchTimer=setTimeout(()=>{a.classList.remove('open');b.classList.remove('open');first=null;second=null;lock=false;statusEl.textContent='Try again! Choose two cards.';},1250);
  }
}
function showRoundDone(){
  const box=document.getElementById('roundDone');
  const title=document.getElementById('doneTitle');
  const text=document.getElementById('doneText');
  const btn=document.getElementById('nextBtn');
  box.classList.add('show');
  if(roundIndex===2){
    title.textContent='🏆 YOU DID IT!';
    text.textContent='You finished all three rounds!';
    btn.textContent='PLAY AGAIN';
  } else {
    title.textContent='🎉 GREAT JOB!';
    text.textContent=`You found all the pairs!`;
    btn.textContent=`NEXT ROUND ➜`;
  }
}
function nextRound(){
  if(roundIndex===2) roundIndex=0; else roundIndex++;
  startRound();
}
function resetRound(){
  if(mismatchTimer) clearTimeout(mismatchTimer);
  startRound();
}
startRound();
</script>
</body>
</html>
