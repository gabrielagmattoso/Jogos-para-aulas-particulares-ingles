<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>School Race</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap">
<style>
:root{--bg:#e9f6ff;--ink:#23284a;--panel:#fff;--mut:#6b6f93;--line:#cfe6f7;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171b33;--ink:#f3f0ff;--panel:#252b4d;--mut:#b4b8dc;--line:#39426e;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#171b33;--ink:#f3f0ff;--panel:#252b4d;--mut:#b4b8dc;--line:#39426e;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Baloo 2","Trebuchet MS",system-ui,sans-serif;min-height:100vh}
main{max-width:1000px;margin:0 auto;padding:12px 14px 18px}
header{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;margin-bottom:10px}
.pl{display:flex;align-items:center;gap:10px;background:var(--panel);border:3px solid var(--line);border-radius:20px;padding:6px 14px 6px 8px;transition:transform .2s,border-color .2s,box-shadow .2s}
.pl.act{border-color:var(--c);box-shadow:0 5px 0 var(--c);transform:translateY(-3px)}
.av{width:42px;height:42px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-weight:800;font-size:22px;flex:none}
.nm{font-size:20px;font-weight:800;line-height:1.05;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dots{display:flex;gap:4px;margin-top:3px}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--c)}
#turn{color:#fff;font-weight:800;font-size:19px;border-radius:999px;padding:3px 18px;background:#6c63ff;white-space:nowrap}
#track{width:100%;height:auto;display:block;border-radius:26px;border:4px solid #fff;box-shadow:0 8px 24px rgba(40,60,120,.18)}
.run{transition:transform .85s cubic-bezier(.35,1.3,.55,1)}
.lg,.am{transform-box:fill-box;transform-origin:50% 0}
.move .l1,.move .a2{animation:sw .2s infinite alternate}
.move .l2,.move .a1{animation:sw .2s infinite alternate-reverse}
.move .bob{animation:bob .2s infinite alternate}
@keyframes sw{from{transform:rotate(-28deg)}to{transform:rotate(28deg)}}
@keyframes bob{to{transform:translateY(-5px)}}
#panel{margin-top:14px;background:var(--panel);border:4px solid #fff;border-radius:28px;padding:18px 22px;display:flex;gap:22px;align-items:center;min-height:250px;box-shadow:0 8px 24px rgba(40,60,120,.14)}
#pic{flex:0 0 230px;height:230px;background:#fff;border-radius:30px;display:grid;place-items:center;padding:10px;border:5px solid #ffd96b;box-shadow:0 6px 0 #f0b93a}
#pic svg,#pic img{width:100%;height:100%;object-fit:contain;border-radius:18px}
#txt{flex:1;min-width:0}
#q{font-size:clamp(28px,4.8vw,48px);font-weight:800;line-height:1.05}
#a{font-size:clamp(23px,3.8vw,36px);font-weight:700;color:#10a36b;margin-top:10px;min-height:1.3em}
#a b{color:#ff6b35;text-decoration:underline wavy;text-underline-offset:6px}
#btns{display:flex;gap:12px;flex-wrap:wrap;margin-top:14px}
button{font:inherit;font-weight:800;font-size:22px;color:#fff;border:0;border-radius:18px;padding:9px 28px;cursor:pointer}
#ok{background:#10a36b;box-shadow:0 5px 0 #0b7a50}
#no{background:#ef4444;box-shadow:0 5px 0 #b32a2a}
#nxt{background:#ff7b54;box-shadow:0 5px 0 #d85a37}
button:active{transform:translateY(4px);box-shadow:none}
button:focus-visible,input:focus-visible{outline:3px solid #6c63ff;outline-offset:2px}
#start{position:fixed;inset:0;z-index:5;background:linear-gradient(#8fd3ff,#e9f6ff 60%);display:grid;place-items:center;padding:env(safe-area-inset-top,0px) 16px env(safe-area-inset-bottom,0px)}
.card{max-width:480px;width:100%;text-align:center;background:var(--panel);border-radius:30px;padding:26px 24px;box-shadow:0 10px 30px rgba(40,60,120,.2)}
h1{font-size:clamp(40px,9vw,62px);line-height:1;margin:0 0 14px;color:#ff6b35}
label{display:block;text-align:left;font-weight:700;margin:8px 0 2px}
input{width:100%;font:inherit;font-size:20px;padding:6px 14px;border-radius:14px;border:3px solid var(--line);background:var(--bg);color:var(--ink)}
#begin{margin-top:20px;font-size:26px;background:#ff7b54;box-shadow:0 5px 0 #d85a37}
@media(max-width:600px){header{grid-template-columns:1fr 1fr}#turn{grid-column:1/-1;order:-1;text-align:center}#panel{flex-direction:column;text-align:center}#pic{flex-basis:auto;width:190px;height:190px}#btns{justify-content:center}}
@media(prefers-reduced-motion:reduce){.run,.pl{transition:none}.move .lg,.move .am,.move .bob{animation:none}}
</style>
</head>
<body>
<main>
<header>
  <div class="pl" id="p0" style="--c:#2f80ed"><span class="av"></span><div><div class="nm"></div><div class="dots"></div></div></div>
  <span id="turn"></span>
  <div class="pl" id="p1" style="--c:#27ae60"><span class="av"></span><div><div class="nm"></div><div class="dots"></div></div></div>
</header>

<svg id="track" viewBox="0 0 800 270" role="img" aria-label="Pista de corrida">
  <defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7cc8f5"/><stop offset="1" stop-color="#d8f1ff"/></linearGradient></defs>
  <rect width="800" height="270" fill="#6fcf4a"/>
  <rect width="800" height="64" fill="url(#sky)"/>
  <circle cx="722" cy="30" r="18" fill="#ffd54a"/>
  <g fill="#fff" opacity=".9"><ellipse cx="110" cy="28" rx="34" ry="11"/><ellipse cx="136" cy="22" rx="22" ry="10"/><ellipse cx="420" cy="38" rx="30" ry="9"/><ellipse cx="442" cy="32" rx="18" ry="8"/></g>
  <path d="M0 64Q120 44 250 62T520 58T800 62V70H0Z" fill="#58b83b"/>
  <g id="lanes"></g>
  <g id="r0" class="run"></g><g id="r1" class="run"></g>
</svg>

<section id="panel" aria-live="polite">
  <div id="pic"></div>
  <div id="txt">
    <div id="q"></div>
    <div id="a"></div>
    <div id="btns">
      <button id="ok">✓ Acertou</button><button id="no">✗ Errou</button>
      <button id="nxt" hidden>Próxima</button>
    </div>
  </div>
</section>
</main>

<div id="start"><div class="card">
  <h1>School Race</h1>
  <label for="n1">Aluno 1</label><input id="n1" value="Aluno 1" maxlength="20">
  <label for="n2">Aluno 2</label><input id="n2" value="Aluno 2" maxlength="20">
  <button id="begin">Começar</button>
</div></div>

ball:'<svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="48" fill="#fff" stroke="#222" stroke-width="5"/><path d="M60 34L82 50L74 76H46L38 50Z" fill="#222"/><path d="M60 34V14M82 50L104 42M74 76L88 98M46 76L32 98M38 50L16 42" stroke="#222" stroke-width="5"/></svg>',
eat:'<svg viewBox="0 0 120 120"><rect x="16" y="84" width="88" height="18" rx="9" fill="#e0a458"/><rect x="12" y="74" width="96" height="12" rx="6" fill="#6cc24a"/><circle cx="34" cy="70" r="8" fill="#e63946"/><circle cx="62" cy="70" r="8" fill="#e63946"/><circle cx="88" cy="70" r="8" fill="#e63946"/><rect x="18" y="60" width="84" height="10" fill="#ffd54a"/><path d="M14 58Q14 30 60 30T106 58Z" fill="#e0a458"/><circle cx="100" cy="36" r="13" fill="#fff"/></svg>',
};
const ic=k=>IMG[k]?`<img src="${IMG[k]}" alt="">`:SVG[k];

const Q=[
['notebook','I am <b>writing</b> in my notebook.'],
['pencil','I am <b>writing</b> with a pencil.'],
['book','I am <b>reading</b> my schoolbook.'],
['desk','I am <b>sitting</b> at the desk.'],
['ball','I am <b>playing</b> football.'],
['eat','I am <b>eating</b> snack at school.'],
['case','I am <b>opening</b> my pencil case.'],
['sm','I am <b>studying</b> science and math.'],
['listen','I am <b>listening</b> to teachers.'],
['sports','I am <b>doing</b> sports and exercise.']];

let names=['Aluno 1','Aluno 2'],pos=[0,0],qs=[],qi=0,who=0,st='';
function lanes(){
  let s='';
  for(let i=0;i<2;i++){
    const y=[72,160][i];
    s+=`<rect x="0" y="${y}" width="800" height="80" fill="#e9976b"/><rect x="0" y="${y+76}" width="800" height="4" fill="#fff"/>`;
    s+=`<path d="M0 ${y+2}H800" stroke="#fff" stroke-width="4"/><rect x="50" y="${y}" width="5" height="80" fill="#fff"/>`;
  }
  for(let r=0;r<16;r++)for(let c=0;c<2;c++)s+=`<rect x="${740+c*12}" y="${72+r*10.5}" width="12" height="10.5" fill="${(r+c)%2?'#222':'#fff'}"/>`;
  $('#lanes').innerHTML=s;
}
function place(i,anim){
  const g=$('#r'+i);
  if(!g.innerHTML)g.innerHTML=`<g transform="translate(0 ${FEET[i]})"><ellipse cy="3" rx="22" ry="5" fill="#000" opacity=".15"/><g transform="scale(.7)">${person(B[i])}</g><text y="-96" text-anchor="middle" font-size="17" font-weight="800" fill="#fff" stroke="${COL[i]}" stroke-width="5" paint-order="stroke" stroke-linejoin="round"></text></g>`;
  g.querySelector('text').textContent=names[i];
  g.style.transform=`translateX(${X0+Math.min(pos[i],STEPS)*DX}px)`;
  if(anim){g.classList.add('move');setTimeout(()=>g.classList.remove('move'),900)}
  score();
}
function score(){
  [0,1].forEach(i=>{
    const p=$('#p'+i);
    p.querySelector('.av').textContent=names[i][0].toUpperCase();
    p.querySelector('.nm').textContent=names[i];
    p.querySelector('.dots').innerHTML=Array.from({length:STEPS},(_,j)=>`<i class="${j<pos[i]?'on':''}"></i>`).join('');
  });
}
function turn(t,c,a){const e=$('#turn');e.textContent=t;e.style.background=c;[0,1].forEach(i=>$('#p'+i).classList.toggle('act',i===a))}
const btns=(o,n,s,x)=>{$('#ok').hidden=!o;$('#no').hidden=!n;$('#nxt').hidden=!x};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};

function ask(){
  if(qi>=qs.length)qs=qs.concat(shuffle(Q));
  const q=qs[qi];who=qi%2;st='ask';
  turn(`Vez de ${names[who]}`,COL[who],who);
  $('#pic').innerHTML=ic(q[0]);$('#q').innerHTML=q[1];$('#a').innerHTML='';
  btns(1,1,0,0);
}
function win(i){
  st='over';turn('Fim da corrida','#8b5cf6',i);
  $('#pic').innerHTML=i<0?`<svg viewBox="-130 -150 260 170"><g transform="translate(-62 0)">${person(B[0])}</g><g transform="translate(62 0)">${person(B[1])}</g><path d="M-18 -112h36v14a18 18 0 0 1-36 0z" fill="#ffd166" stroke="#d9a520" stroke-width="3"/></svg>`:`<svg viewBox="-60 -150 120 170">${person(B[i])}<path d="M-18 -152h36v14a18 18 0 0 1-36 0z" fill="#ffd166" stroke="#d9a520" stroke-width="3"/></svg>`;
  $('#q').textContent=i<0?'It’s a tie!':`${names[i]} wins!`;
  $('#a').textContent=`${pos[0]} × ${pos[1]}`;
  btns(0,0,0,1);$('#nxt').textContent='Jogar de novo';
}
function point(i){
  pos[i]++;place(i,true);
  st='done';btns(0,0,0,1);$('#nxt').textContent='Próxima';
}
$('#ok').onclick=()=>{if(st==='ask')point(who);else if(st==='steal')point(1-who)};
$('#no').onclick=()=>{
  if(st==='ask'){st='steal';turn(`Roubar! Vez de ${names[1-who]}`,'#ef4444',1-who)}
  else if(st==='steal'){st='done';btns(0,0,0,1);$('#nxt').textContent='Próxima'}
};
$('#nxt').onclick=()=>{
  if(st==='over')return reset();
  // só termina depois que os dois já começaram uma rodada, e sem empate
  if(qi%2===1&&pos.some(p=>p>=STEPS)&&pos[0]!==pos[1])return win(pos[0]>pos[1]?0:1);
  qi++;ask();
};

function reset(){
  pos=[0,0];qi=0;qs=shuffle(Q);
  document.querySelectorAll('.run').forEach(g=>g.style.transition='none');
  place(0);place(1);
  requestAnimationFrame(()=>requestAnimationFrame(()=>document.querySelectorAll('.run').forEach(g=>g.style.transition='')));
  ask();
}
$('#begin').onclick=()=>{
  names=[$('#n1').value.trim()||'Aluno 1',$('#n2').value.trim()||'Aluno 2'];
  $('#start').hidden=true;reset();
};
lanes();place(0);place(1);
</script>
